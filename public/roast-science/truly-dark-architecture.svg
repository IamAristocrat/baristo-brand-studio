<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Truly Dark roast architecture representation</title><desc id="desc">Scientific-style representation of an intense dark coffee roast progression, using black, copper and rose-gold Baristo tones.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a09"/><stop offset="1" stop-color="#1d1714"/></linearGradient><linearGradient id="curve" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b77054"/><stop offset="1" stop-color="#f0b08e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter></defs><rect width="1200" height="760" rx="42" fill="url(#bg)"/><g opacity=".16" fill="none" stroke="#b77054"><circle cx="1040" cy="120" r="170"/><circle cx="1040" cy="120" r="120"/><circle cx="1040" cy="120" r="70"/></g><text x="78" y="92" fill="#d49373" font-family="Georgia,serif" font-size="24" letter-spacing="6">BARISTO · ROAST ARCHITECTURE</text><text x="78" y="158" fill="#f8eee7" font-family="Georgia,serif" font-size="58">Truly Dark</text><text x="78" y="204" fill="#c8a89a" font-family="Arial,sans-serif" font-size="22">Intense Dark · Intensity without vulgar bitterness</text><line x1="82" y1="586" x2="1120" y2="586" stroke="#6f4b3d" stroke-width="2"/><path d="M92 560 C220 548 284 510 370 470 C470 422 548 360 640 304 C748 238 860 202 1110 138" fill="none" stroke="url(#curve)" stroke-width="9" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><g transform="translate(130 544)"><ellipse rx="34" ry="48" transform="rotate(-18)" fill="#78925f"/><path d="M0-40 C8-14 8 14 0 40" stroke="#e6eed8" fill="none" stroke-width="3"/><text y="82" fill="#e7c2b0">GREEN</text></g><g transform="translate(350 478)"><ellipse rx="36" ry="50" transform="rotate(-18)" fill="#a8794d"/><path d="M0-41 C8-14 8 14 0 41" stroke="#f0ca99" fill="none" stroke-width="3"/><text y="82" fill="#e7c2b0">DRYING</text></g><g transform="translate(610 322)"><ellipse rx="39" ry="53" transform="rotate(-18)" fill="#77432e"/><path d="M0-44 C9-15 9 15 0 44" stroke="#b56e50" fill="none" stroke-width="3"/><text y="86" fill="#e7c2b0">FIRST CRACK+</text></g><g transform="translate(860 204)"><ellipse rx="42" ry="56" transform="rotate(-18)" fill="#3a241d"/><path d="M0-46 C10-16 10 16 0 46" stroke="#9f5d44" fill="none" stroke-width="3"/><text y="90" fill="#e7c2b0">DEEP DEVELOPMENT</text></g><g transform="translate(1080 145)" filter="url(#shadow)"><ellipse rx="45" ry="59" transform="rotate(-18)" fill="#201511"/><path d="M0-49 C10-17 10 17 0 49" stroke="#d49373" fill="none" stroke-width="4"/><text y="96" fill="#f0c6b3">TARGET</text></g></g><g transform="translate(78 640)" font-family="Arial,sans-serif"><text fill="#f3d8ca" font-size="18">Control logic:</text><text x="118" fill="#c8a89a" font-size="18">lower reflectance · higher mass loss · deeper development · oil tendency · bitterness discipline · cupping</text><text y="38" fill="#a98779" font-size="16">Representation only. Second-crack proximity may occur, but it is not used as a universal specification by itself.</text></g></svg>