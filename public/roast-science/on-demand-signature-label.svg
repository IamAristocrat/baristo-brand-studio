<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Baristo On-Demand Batch signature-label packaging representation</title><desc id="desc">A premium rose-gold Noble Dark pouch and black Truly Dark pouch with large centered signature labels, shown as illustrative packaging rather than exact delivered packs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120f0d"/><stop offset="1" stop-color="#2a1c17"/></linearGradient><linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d7ca"/><stop offset=".45" stop-color="#c98262"/><stop offset="1" stop-color="#7f432f"/></linearGradient><linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26211e"/><stop offset="1" stop-color="#070706"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter></defs><rect width="1200" height="760" rx="42" fill="url(#bg)"/><text x="70" y="92" fill="#d49373" font-family="Georgia,serif" font-size="24" letter-spacing="6">ON-DEMAND BATCH · SIGNATURE LABEL SYSTEM</text><text x="70" y="150" fill="#f7eee8" font-family="Georgia,serif" font-size="48">Sticker-finished can still read as deliberate luxury.</text><g filter="url(#shadow)"><g transform="translate(190 210)"><path d="M0 40 Q0 0 40 0 H280 Q320 0 320 40 V450 Q320 490 280 490 H40 Q0 490 0 450Z" fill="url(#rose)" stroke="#e5aa8d" stroke-width="3"/><path d="M28 35 H292" stroke="#8f4d38" stroke-opacity=".5"/><rect x="42" y="118" width="236" height="250" rx="10" fill="#f8e7df" stroke="#8c4c36" stroke-width="3"/><text x="160" y="168" text-anchor="middle" fill="#7c3f2d" font-family="Georgia,serif" font-size="20">BARISTO.ONLINE</text><text x="160" y="232" text-anchor="middle" fill="#4a2d23" font-family="Georgia,serif" font-size="38">Noble Dark</text><text x="160" y="272" text-anchor="middle" fill="#8d5d4b" font-family="Arial,sans-serif" font-size="16">MEDIUM-DARK ROAST</text><line x1="80" y1="305" x2="240" y2="305" stroke="#b77054"/><text x="160" y="338" text-anchor="middle" fill="#6e4b3c" font-family="Arial,sans-serif" font-size="14">SIGNATURE LABEL</text><text x="160" y="405" text-anchor="middle" fill="#532f25" font-family="Arial,sans-serif" font-size="13">Premium pouch · clean placement</text></g><g transform="translate(690 210)"><path d="M0 40 Q0 0 40 0 H280 Q320 0 320 40 V450 Q320 490 280 490 H40 Q0 490 0 450Z" fill="url(#black)" stroke="#6f4b3d" stroke-width="3"/><path d="M28 35 H292" stroke="#d49373" stroke-opacity=".45"/><rect x="42" y="118" width="236" height="250" rx="10" fill="#0e0d0c" stroke="#b77054" stroke-width="3"/><text x="160" y="168" text-anchor="middle" fill="#d49373" font-family="Georgia,serif" font-size="20">BARISTO.ONLINE</text><text x="160" y="232" text-anchor="middle" fill="#f6eee9" font-family="Georgia,serif" font-size="38">Truly Dark</text><text x="160" y="272" text-anchor="middle" fill="#d5a38a" font-family="Arial,sans-serif" font-size="16">INTENSE DARK ROAST</text><line x1="80" y1="305" x2="240" y2="305" stroke="#b77054"/><text x="160" y="338" text-anchor="middle" fill="#d49373" font-family="Arial,sans-serif" font-size="14">SIGNATURE LABEL</text><text x="160" y="405" text-anchor="middle" fill="#caa493" font-family="Arial,sans-serif" font-size="13">Matte black pouch · precise finish</text></g></g><g transform="translate(70 660)" font-family="Arial,sans-serif"><text fill="#f1d8cc" font-size="19">Production discipline:</text><text x="190" fill="#c5a496" font-size="19">large label · exact alignment · clean corners · zero bubbles · consistent margins · premium barrier pouch</text><text y="35" fill="#9f8175" font-size="15">Packaging representation only; not a promise that the illustrated pouch geometry or finish exactly matches the delivered unit.</text></g></svg>