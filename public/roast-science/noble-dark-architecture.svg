<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Noble Dark roast architecture representation</title><desc id="desc">Scientific-style representation of a medium-dark coffee roast progression from green bean to developed roast, using Baristo rose-gold and espresso tones.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9f4"/><stop offset="1" stop-color="#ead2c7"/></linearGradient><linearGradient id="curve" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b77054"/><stop offset="1" stop-color="#4a2d23"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4a2d23" flood-opacity=".15"/></filter></defs><rect width="1200" height="760" rx="42" fill="url(#bg)"/><g opacity=".18" fill="none" stroke="#b77054"><circle cx="1040" cy="120" r="170"/><circle cx="1040" cy="120" r="120"/><circle cx="1040" cy="120" r="70"/></g><text x="78" y="92" fill="#b77054" font-family="Georgia,serif" font-size="24" letter-spacing="6">BARISTO · ROAST ARCHITECTURE</text><text x="78" y="158" fill="#4a2d23" font-family="Georgia,serif" font-size="58">Noble Dark</text><text x="78" y="204" fill="#795746" font-family="Arial,sans-serif" font-size="22">Medium-Dark · Structure without harshness</text><line x1="82" y1="586" x2="1120" y2="586" stroke="#cba18d" stroke-width="2"/><path d="M92 560 C220 545 260 520 355 482 C458 440 505 392 586 345 C680 290 760 255 865 220 C956 190 1034 170 1112 154" fill="none" stroke="url(#curve)" stroke-width="9" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><g transform="translate(130 544)"><ellipse rx="34" ry="48" transform="rotate(-18)" fill="#78925f"/><path d="M0-40 C8-14 8 14 0 40" stroke="#e6eed8" fill="none" stroke-width="3"/><text y="82" fill="#4a2d23">GREEN</text></g><g transform="translate(340 486)"><ellipse rx="36" ry="50" transform="rotate(-18)" fill="#b98c56"/><path d="M0-41 C8-14 8 14 0 41" stroke="#f1d4a4" fill="none" stroke-width="3"/><text y="82" fill="#4a2d23">DRYING</text></g><g transform="translate(570 350)"><ellipse rx="38" ry="52" transform="rotate(-18)" fill="#9b603d"/><path d="M0-43 C9-15 9 15 0 43" stroke="#d9a487" fill="none" stroke-width="3"/><text y="84" fill="#4a2d23">BROWNING</text></g><g transform="translate(820 235)"><ellipse rx="40" ry="54" transform="rotate(-18)" fill="#6f3f2b"/><path d="M0-45 C9-15 9 15 0 45" stroke="#b8795a" fill="none" stroke-width="3"/><text y="86" fill="#4a2d23">FIRST CRACK+</text></g><g transform="translate(1080 164)" filter="url(#shadow)"><ellipse rx="44" ry="58" transform="rotate(-18)" fill="#4a2d23"/><path d="M0-48 C10-17 10 17 0 48" stroke="#b77054" fill="none" stroke-width="4"/><text y="94" fill="#4a2d23">TARGET</text></g></g><g transform="translate(78 640)" font-family="Arial,sans-serif"><text fill="#4a2d23" font-size="18">Control logic:</text><text x="118" fill="#795746" font-size="18">roast color · mass loss · post-first-crack development · aroma · rate-of-rise · cupping</text><text y="38" fill="#795746" font-size="16">Representation only. Final limits are calibrated against the production roaster and measurement instrument.</text></g></svg>