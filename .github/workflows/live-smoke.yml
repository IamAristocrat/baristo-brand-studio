name: Baristo live deployment smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Hostinger automatic deployment
        run: sleep 45

      - name: Verify apex and www responses
        shell: bash
        run: |
          set -euo pipefail
          for host in baristo.online www.baristo.online; do
            echo "=== ${host} ==="
            curl -sSIL --max-time 20 "https://${host}/" | sed -n '1,18p'
            body="$(curl -LfsS --max-time 20 "https://${host}/")"
            grep -qi "Experience Your Nobility" <<<"$body"
            echo "SSR shell present on ${host}"
            printf '%s' "$body" > "/tmp/${host}.html"
          done

      - name: Verify stylesheet and image assets from both hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in baristo.online www.baristo.online; do
            body="$(cat "/tmp/${host}.html")"
            css_path="$(grep -Eo 'href="[^"]+\.css[^\"]*"' <<<"$body" | head -1 | sed -E 's/^href="|"$//g' || true)"
            img_path="$(grep -Eo 'src="[^"]+\.(png|jpg|jpeg|webp|svg)[^\"]*"' <<<"$body" | head -1 | sed -E 's/^src="|"$//g' || true)"
            echo "${host} stylesheet: ${css_path:-NONE}"
            echo "${host} first image: ${img_path:-NONE}"
            test -n "$css_path"
            if [[ "$css_path" == http* ]]; then css_url="$css_path"; else css_url="https://${host}${css_path}"; fi
            curl -LfsS --max-time 20 "$css_url" >/dev/null
            echo "CSS asset OK on ${host}"
            if [[ -n "$img_path" ]]; then
              if [[ "$img_path" == http* ]]; then img_url="$img_path"; else img_url="https://${host}${img_path}"; fi
              curl -LfsS --max-time 20 "$img_url" >/dev/null
              echo "Image asset OK on ${host}"
            fi
          done

      - name: Verify roast-science assets and public routes
        run: |
          curl -LfsS --max-time 20 https://baristo.online/roast-science/noble-dark-architecture.svg >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/roast-science/truly-dark-architecture.svg >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/roast-science/on-demand-signature-label.svg >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/journal >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/journal/truly-dark-intense-dark-roast-indian-arabica >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/evidence-hub >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/roasts/truly-dark >/dev/null
