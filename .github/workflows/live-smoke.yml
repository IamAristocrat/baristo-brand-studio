name: Baristo live deployment smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Hostinger automatic deployment
        run: sleep 45

      - name: Verify latest homepage is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            echo "Live check attempt ${attempt}/20"
            body="$(curl -LfsS --max-time 20 https://baristo.online/ || true)"
            if grep -qi "Roast Architecture" <<<"$body" && grep -qi "On-Demand Batch" <<<"$body" && grep -qi "Experience Your Nobility" <<<"$body"; then
              echo "Latest Baristo homepage content is live."
              exit 0
            fi
            sleep 20
          done
          echo "Latest content was not visible on baristo.online within the smoke-check window."
          exit 1

      - name: Verify public routes
        run: |
          curl -LfsS --max-time 20 https://baristo.online/journal >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/journal/truly-dark-intense-dark-roast-indian-arabica >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/evidence-hub >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/roasts/truly-dark >/dev/null
