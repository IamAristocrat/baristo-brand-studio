name: Baristo live deployment smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Hostinger automatic deployment
        run: sleep 45

      - name: Diagnose apex and www asset delivery
        shell: bash
        run: |
          set -u
          failed=0
          for host in baristo.online www.baristo.online; do
            echo "===== ${host} ====="
            meta="$(curl -sSL --max-time 20 -o "/tmp/${host}.html" -w '%{http_code}|%{url_effective}|%{content_type}' "https://${host}/" || true)"
            echo "page=${meta}"
            body="$(cat "/tmp/${host}.html" 2>/dev/null || true)"
            if grep -qi "Experience Your Nobility" <<<"$body"; then echo "shell=present"; else echo "shell=MISSING"; failed=1; fi

            css_path="$(grep -Eo 'href="[^"]+\.css[^\"]*"' <<<"$body" | head -1 | sed -E 's/^href="|"$//g' || true)"
            img_path="$(grep -Eo 'src="[^"]+\.(png|jpg|jpeg|webp|svg)[^\"]*"' <<<"$body" | head -1 | sed -E 's/^src="|"$//g' || true)"
            echo "css_path=${css_path:-NONE}"
            echo "img_path=${img_path:-NONE}"

            if [[ -n "$css_path" ]]; then
              if [[ "$css_path" == http* ]]; then css_url="$css_path"; else css_url="https://${host}${css_path}"; fi
              css_meta="$(curl -sSL --max-time 20 -o /tmp/asset.css -w '%{http_code}|%{url_effective}|%{content_type}|%{size_download}' "$css_url" || true)"
              echo "css=${css_meta}"
              [[ "$css_meta" == 200* ]] || failed=1
            else
              failed=1
            fi

            if [[ -n "$img_path" ]]; then
              if [[ "$img_path" == http* ]]; then img_url="$img_path"; else img_url="https://${host}${img_path}"; fi
              img_meta="$(curl -sSL --max-time 20 -o /tmp/asset.img -w '%{http_code}|%{url_effective}|%{content_type}|%{size_download}' "$img_url" || true)"
              echo "image=${img_meta}"
            fi
          done
          exit "$failed"

      - name: Verify public routes
        run: |
          curl -LfsS --max-time 20 https://baristo.online/journal >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/evidence-hub >/dev/null
          curl -LfsS --max-time 20 https://baristo.online/roasts/truly-dark >/dev/null
